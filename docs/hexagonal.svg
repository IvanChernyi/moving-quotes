<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#1c1e21">Moving quote calculator — hexagonal view, as built</text>
  <text x="500" y="52" text-anchor="middle" fill="#6b7280">two aggregates inside · sockets on the edge · plugs outside · main.ts picks the plugs</text>

  <text x="105" y="128" text-anchor="middle" font-size="12" fill="#6b7280" font-style="italic">driving side — who calls in</text>
  <text x="888" y="128" text-anchor="middle" font-size="12" fill="#6b7280" font-style="italic">driven side — what the core calls</text>

  <!-- app layer -->
  <polygon points="710,330 600,140 380,140 270,330 380,520 600,520" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="490" y="158" text-anchor="middle" font-weight="600" fill="#3730a3">app layer · commands/quotes.ts</text>
  <text x="490" y="174" text-anchor="middle" font-size="11" fill="#4338ca">load → verb → append at the version read</text>
  <text x="490" y="189" text-anchor="middle" font-size="11" fill="#4338ca">day stream: re-read and retry on conflict</text>
  <text x="490" y="482" text-anchor="middle" font-size="11" fill="#4338ca">confirm: reserve trucks, then lock the quote</text>
  <text x="490" y="497" text-anchor="middle" font-size="11" fill="#4338ca">cancel: cancel the quote, then release trucks</text>

  <!-- domain -->
  <polygon points="640,330 565,200 415,200 340,330 415,460 565,460" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="490" y="222" text-anchor="middle" font-weight="600" fill="#065f46">domain · pure</text>
  <text x="490" y="243" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">Quote · aggregate</text>
  <text x="490" y="258" text-anchor="middle" font-size="11" fill="#047857">draft → confirmed → cancelled</text>
  <text x="490" y="273" text-anchor="middle" font-size="11" fill="#047857">lines · route · date · trucks</text>
  <text x="490" y="287" text-anchor="middle" font-size="11" fill="#047857">movers · locked price</text>
  <text x="490" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">TruckDay · aggregate</text>
  <text x="490" y="325" text-anchor="middle" font-size="11" fill="#047857">one per date · reservations</text>
  <text x="490" y="339" text-anchor="middle" font-size="11" fill="#047857">never more than the fleet</text>
  <text x="490" y="362" text-anchor="middle" font-size="11" fill="#047857">estimate · suggestedMovers</text>
  <text x="490" y="376" text-anchor="middle" font-size="11" fill="#047857">Now { at, today } · daysBetween</text>
  <text x="490" y="398" text-anchor="middle" font-size="11" fill="#047857">verbs: (aggregate, input, now)</text>
  <text x="490" y="412" text-anchor="middle" font-size="11" fill="#047857">→ Result&lt;Event[]&gt;</text>
  <text x="490" y="436" text-anchor="middle" font-size="11" fill="#059669">no clock · no ids · no I/O</text>

  <!-- driving socket -->
  <rect x="205" y="312" width="130" height="36" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="270" y="327" text-anchor="middle" font-size="11" fill="#3730a3">socket</text>
  <text x="270" y="341" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">command functions</text>

  <!-- driven sockets -->
  <rect x="598" y="206" width="170" height="52" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="683" y="220" text-anchor="middle" font-size="11" fill="#3730a3">sockets · one store, two views</text>
  <text x="683" y="235" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">EventStore&lt;E&gt; · write</text>
  <text x="683" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">EventFeed&lt;E&gt; · read</text>

  <rect x="645" y="312" width="122" height="36" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="706" y="327" text-anchor="middle" font-size="11" fill="#3730a3">socket</text>
  <text x="706" y="341" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">DistanceSource</text>

  <rect x="598" y="404" width="170" height="40" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="683" y="420" text-anchor="middle" font-size="11" fill="#3730a3">rates · catalogue · fleetSize</text>
  <text x="683" y="435" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">ReferenceData</text>

  <!-- driving adapters -->
  <rect x="25" y="160" width="160" height="40" rx="8" fill="#f6f7f9" stroke="#9ca3af"/>
  <text x="105" y="177" text-anchor="middle" font-weight="600" fill="#1c1e21">Web UI</text>
  <text x="105" y="192" text-anchor="middle" font-size="11" fill="#6b7280">public/index.html</text>
  <rect x="25" y="250" width="160" height="40" rx="8" fill="#f6f7f9" stroke="#9ca3af"/>
  <text x="105" y="267" text-anchor="middle" font-weight="600" fill="#1c1e21">HTTP routes</text>
  <text x="105" y="282" text-anchor="middle" font-size="11" fill="#6b7280">zod at the edge · reply()</text>
  <rect x="25" y="345" width="160" height="40" rx="8" fill="#f6f7f9" stroke="#9ca3af"/>
  <text x="105" y="362" text-anchor="middle" font-weight="600" fill="#1c1e21">tests</text>
  <text x="105" y="377" text-anchor="middle" font-size="11" fill="#6b7280">call the same functions</text>
  <line x1="105" y1="200" x2="105" y2="248" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="185" y1="275" x2="205" y2="318" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="185" y1="362" x2="205" y2="342" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- driven adapters -->
  <rect x="800" y="165" width="180" height="40" rx="8" fill="#f6f7f9" stroke="#9ca3af"/>
  <text x="890" y="182" text-anchor="middle" font-weight="600" fill="#1c1e21">SqlEventStore</text>
  <text x="890" y="197" text-anchor="middle" font-size="11" fill="#6b7280">SQLite · two tables · seq</text>
  <rect x="800" y="220" width="180" height="40" rx="8" fill="#f6f7f9" stroke="#9ca3af"/>
  <text x="890" y="237" text-anchor="middle" font-weight="600" fill="#1c1e21">InMemoryEventStore</text>
  <text x="890" y="252" text-anchor="middle" font-size="11" fill="#6b7280">tests · not a mock</text>
  <rect x="800" y="300" width="180" height="40" rx="8" fill="#f6f7f9" stroke="#9ca3af"/>
  <text x="890" y="317" text-anchor="middle" font-weight="600" fill="#1c1e21">FakeMapsDistanceSource</text>
  <text x="890" y="332" text-anchor="middle" font-size="11" fill="#6b7280">stands in for the maps API</text>
  <rect x="800" y="350" width="180" height="40" rx="8" fill="#f6f7f9" stroke="#9ca3af"/>
  <text x="890" y="367" text-anchor="middle" font-weight="600" fill="#1c1e21">FixedDistanceSource</text>
  <text x="890" y="382" text-anchor="middle" font-size="11" fill="#6b7280">tests · offline</text>
  <rect x="800" y="420" width="180" height="40" rx="8" fill="#f6f7f9" stroke="#9ca3af"/>
  <text x="890" y="437" text-anchor="middle" font-weight="600" fill="#1c1e21">constants.ts</text>
  <text x="890" y="452" text-anchor="middle" font-size="11" fill="#6b7280">rates · weights · fleet</text>
  <line x1="800" y1="185" x2="770" y2="225" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="800" y1="240" x2="770" y2="238" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="800" y1="320" x2="769" y2="326" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="800" y1="370" x2="769" y2="340" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="800" y1="440" x2="770" y2="428" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="784" y="288" text-anchor="middle" font-size="11" fill="#6b7280">implements</text>

  <!-- read side -->
  <text x="205" y="560" font-size="12" font-weight="600" fill="#9a3412">read side · projections fold EventFeed.readAll() on each request</text>
  <rect x="205" y="570" width="180" height="42" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="295" y="587" text-anchor="middle" font-weight="600" fill="#9a3412">calculator page</text>
  <text x="295" y="603" text-anchor="middle" font-size="11" fill="#c2410c">quoteView: fold + estimate</text>
  <rect x="400" y="570" width="180" height="42" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="490" y="587" text-anchor="middle" font-weight="600" fill="#9a3412">availability calendar</text>
  <text x="490" y="603" text-anchor="middle" font-size="11" fill="#c2410c">calendar: free trucks per date</text>
  <rect x="595" y="570" width="180" height="42" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="685" y="587" text-anchor="middle" font-weight="600" fill="#9a3412">office list</text>
  <text x="685" y="603" text-anchor="middle" font-size="11" fill="#c2410c">officeList: quotes, newest first</text>
  <path d="M25,180 L12,180 L12,591 L203,591" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="108" y="584" text-anchor="middle" font-size="11" fill="#6b7280">UI shows them</text>
  <path d="M980,185 L992,185 L992,591 L777,591" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="884" y="584" text-anchor="middle" font-size="11" fill="#6b7280">events feed the projections</text>

  <!-- composition root -->
  <rect x="25" y="640" width="955" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="502" y="656" text-anchor="middle" font-weight="600" fill="#92400e">main.ts · composition root</text>
  <text x="502" y="671" text-anchor="middle" font-size="11" fill="#b45309">fake maps (a real maps plug later, nothing else changes) · constant rates, catalogue and fleet · two SQL stores in one SQLite file · clock in the company time zone · randomUUID · port 3100</text>
</svg>
