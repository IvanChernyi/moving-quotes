<text x="34" y="192" font-size="15" font-weight="700" fill="#1c1e21">Quote</text>
<text x="34" y="211" font-size="11.5" fill="#44403c">decided by the sales person</text>
<text x="34" y="230" font-size="11" fill="#1c1e21">rule: priced from the list;</text>
<text x="34" y="246" font-size="11" fill="#1c1e21">locked at the customer's yes</text>
<text x="34" y="268" font-size="10.5" font-style="italic" fill="#6b7280">one per move</text>
