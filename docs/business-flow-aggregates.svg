<rect width="1300" height="1048" fill="#ffffff"/>
<text x="650" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1c1e21">Moving company: four aggregates, one move</text>
<text x="650" y="56" text-anchor="middle" fill="#6b7280">each aggregate is decided by one role · the move's id is the thread through them · numbers give the order</text>
<text x="650" y="76" text-anchor="middle" font-size="12" fill="#6b7280">orange: a fact · purple line: the move · green: a view · red: when things fall apart</text>
<rect x="20" y="96" width="1260" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="34" y="117" font-size="13" font-weight="600" fill="#14532d">The move board</text>
<text x="34" y="133" font-size="11" fill="#166534">a view built from all four</text>
