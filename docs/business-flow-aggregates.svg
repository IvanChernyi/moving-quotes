<text x="34" y="490" font-size="11" fill="#1c1e21">rule: extras priced from the</text>
<text x="34" y="506" font-size="11" fill="#1c1e21">list; a move is done once</text>
<text x="34" y="528" font-size="10.5" font-style="italic" fill="#6b7280">one per move, per day</text>
<rect x="20" y="556" width="1260" height="120" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-opacity="0.35"/>
